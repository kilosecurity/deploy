<VirtualHost *:80>
    ServerName live.nextid.app

    ProxyPreserveHost On

    # MERCURE ENDPOINT
    ProxyPass "/.well-known/mercure" "http://127.0.0.1:3000/.well-known/mercure" retry=0
    ProxyPassReverse "/.well-known/mercure" "http://127.0.0.1:3000/.well-known/mercure"

    SetEnv proxy-sendchunked 1
    SetEnv force-proxy-request-1.0 1

    ProxyTimeout 3600

    ErrorLog ${APACHE_LOG_DIR}/mercure_error.log
    CustomLog ${APACHE_LOG_DIR}/mercure_access.log combined
</VirtualHost>

