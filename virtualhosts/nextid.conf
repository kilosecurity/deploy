<VirtualHost *:80>
    ServerName nextid.app
    ServerAlias www.nextid.app

    DocumentRoot /var/www/web/public
    DirectoryIndex index.php index.html

    <Directory /var/www/nextid/public>
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/nextid_error.log
    CustomLog ${APACHE_LOG_DIR}/nextid_access.log combined
</VirtualHost>