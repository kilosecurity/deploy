<VirtualHost *:80>
    ServerName api.nextid.app

    DocumentRoot /var/www/api/public
    DirectoryIndex index.php index.html

    <Directory /var/www/api/public>
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/nextid_error.log
    CustomLog ${APACHE_LOG_DIR}/nextid_access.log combined
</VirtualHost>